<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>
AI Branding Auditor
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="container mt-5">


<h1>
AI Branding Auditor
</h1>


<p th:text="${message}">
</p>


<form action="/scan" method="post">


<label>
Repository Folder
</label>


<input
class="form-control mb-3"
name="repositoryPath"
th:value="${repositoryPath}"
placeholder="C:\Projects\Repository">


<button class="btn btn-primary">
Scan Repository
</button>


</form>



<form action="/report" method="post" class="mt-3">


<button class="btn btn-success">
Generate Report
</button>


</form>



<h3 class="mt-4">
Results
</h3>


<textarea
class="form-control"
rows="20"
readonly
th:text="${result}">
</textarea>



<a href="/help"
class="btn btn-secondary mt-3">
Help
</a>


</body>

</html>
